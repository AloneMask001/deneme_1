name: Finans uyarıları

on:
  schedule:
    - cron: "*/15 * * * *"   # 15 dk'da bir (GitHub gecikebilir)
  workflow_dispatch:

permissions:
  contents: write   # state.json'ı geri commit'lemek için

concurrency: finance-alerts

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python finance-alerts/check.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: state.json'ı kaydet
        run: |
          git config user.name "finance-bot"
          git config user.email "finance-bot@users.noreply.github.com"
          git add finance-alerts/state.json
          git diff --cached --quiet || (git commit -m "chore: uyarı durumu güncellendi" && git push)
